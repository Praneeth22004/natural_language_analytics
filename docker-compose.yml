version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: incident_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incident_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enterprise_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: incident_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: incident_ai_backend
    restart: unless-stopped
    environment:
      - SERVICENOW_INSTANCE_URL=${SERVICENOW_INSTANCE_URL:-https://dev00000.service-now.com}
      - SERVICENOW_USERNAME=${SERVICENOW_USERNAME:-admin}
      - SERVICENOW_PASSWORD=${SERVICENOW_PASSWORD:-password}
      - SERVICENOW_USE_MOCK_FALLBACK=${SERVICENOW_USE_MOCK_FALLBACK:-true}
      - DATABASE_URL=postgresql+asyncpg://postgres:enterprise_password@postgres:5432/incident_analytics
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-semantic_engine}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: incident_ai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
